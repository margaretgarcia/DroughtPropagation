<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 524" font-family="Arial, Helvetica, sans-serif" fill="#111">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
    <marker id="ahL" markerWidth="10" markerHeight="10" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#333"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dadada"/>
      <stop offset="1" stop-color="#9c9c9c"/>
    </linearGradient>
  </defs>

  <!-- column headers -->
  <rect x="45" y="14" width="230" height="32" fill="url(#hdr)" stroke="#555"/>
  <text x="160" y="36" text-anchor="middle" font-size="16">Dynamic Variables</text>
  <rect x="365" y="14" width="230" height="32" fill="url(#hdr)" stroke="#555"/>
  <text x="480" y="36" text-anchor="middle" font-size="16">Static Attributes</text>

  <!-- left column -->
  <rect x="45" y="60" width="230" height="62" fill="#fff" stroke="#000"/>
  <text x="160" y="78" text-anchor="middle" font-size="14">
    <tspan x="160">Precipitation, soil</tspan>
    <tspan x="160" dy="17">moisture, temperature,</tspan>
    <tspan x="160" dy="17">runoff</tspan>
  </text>
  <rect x="45" y="146" width="230" height="62" fill="#fff" stroke="#000"/>
  <text x="160" y="164" text-anchor="middle" font-size="14">
    <tspan x="160">Fit distributions and</tspan>
    <tspan x="160" dy="17">compute standardized</tspan>
    <tspan x="160" dy="17">indices</tspan>
  </text>
  <rect x="45" y="232" width="230" height="62" fill="#fff" stroke="#000"/>
  <text x="160" y="258" text-anchor="middle" font-size="14">
    <tspan x="160">Dynamic Input Data</tspan>
    <tspan x="160" dy="17">(Train/Test/Validate)</tspan>
  </text>

  <!-- right column -->
  <rect x="365" y="60" width="230" height="62" fill="#fff" stroke="#000"/>
  <text x="480" y="78" text-anchor="middle" font-size="14">
    <tspan x="480">Climate, topographic,</tspan>
    <tspan x="480" dy="17">and land cover/use</tspan>
    <tspan x="480" dy="17">metrics</tspan>
  </text>
  <rect x="365" y="146" width="230" height="62" fill="#fff" stroke="#000"/>
  <text x="480" y="173" text-anchor="middle" font-size="14">
    <tspan x="480">Compute z-scores to</tspan>
    <tspan x="480" dy="17">normalize</tspan>
  </text>
  <rect x="365" y="232" width="230" height="62" fill="#fff" stroke="#000"/>
  <text x="480" y="268" text-anchor="middle" font-size="14">Static Input Data</text>

  <!-- vertical arrows -->
  <g stroke="#333" stroke-width="1.6">
    <line x1="160" y1="122" x2="160" y2="145" marker-end="url(#ah)"/>
    <line x1="160" y1="208" x2="160" y2="231" marker-end="url(#ah)"/>
    <line x1="160" y1="294" x2="160" y2="317" marker-end="url(#ah)"/>
    <line x1="480" y1="122" x2="480" y2="145" marker-end="url(#ah)"/>
    <line x1="480" y1="208" x2="480" y2="231" marker-end="url(#ah)"/>
    <line x1="480" y1="294" x2="480" y2="317" marker-end="url(#ah)"/>
  </g>

  <!-- model box -->
  <rect x="45" y="318" width="550" height="126" fill="#fff" stroke="#000"/>
  <rect x="95" y="344" width="150" height="48" fill="#fff" stroke="#000"/>
  <text x="170" y="373" text-anchor="middle" font-size="15">ConvLSTM</text>
  <rect x="395" y="344" width="150" height="48" fill="#fff" stroke="#000"/>
  <text x="470" y="373" text-anchor="middle" font-size="15">CNN</text>
  <line x1="248" y1="368" x2="392" y2="368" stroke="#333" stroke-width="1.6"
        marker-start="url(#ahL)" marker-end="url(#ah)"/>
  <text x="320" y="360" text-anchor="middle" font-size="14">Parallel</text>
  <text x="320" y="386" text-anchor="middle" font-size="14">Concatenation</text>
  <text x="320" y="426" text-anchor="middle" font-size="15" font-weight="700">CNN-ConvLSTM Model</text>

  <!-- to evaluate -->
  <line x1="320" y1="444" x2="320" y2="467" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="45" y="468" width="550" height="42" fill="#fff" stroke="#000"/>
  <text x="320" y="494" text-anchor="middle" font-size="15">Evaluate Results</text>
</svg>
